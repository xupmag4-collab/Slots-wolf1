<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Слоты от Волка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="machine">
        <h1>🐺 Слоты от Волка</h1>
        
        <div class="balance">
            Баланс: <span id="balance">100</span> монет
        </div>

        <div class="reels" id="reels">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">💎</div>
        </div>

        <div class="result" id="result">Нажми «Крутить»!</div>

        <button id="spinBtn" onclick="spin()">🎰 Крутить (10 монет)</button>

        <div class="stats">
            <div>Побед: <span id="wins">0</span></div>
            <div>Спинов: <span id="spins">0</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
